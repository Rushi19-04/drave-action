name: 'DRAVE Detection Validator'
description: 'Run the DRAVE validation engine against your Sigma/detection rules. Computes real evidence reports (syntax, schema, tests, attack replay, robustness, volume) and syncs results to the DRAVE SaaS dashboard.'
author: 'Rushi19-04'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  rule-paths:
    description: 'Path to the directory containing your detection rule YAML files.'
    required: false
    default: 'detections/rules'
  api-key:
    description: 'Your DRAVE CI API Key (generate from Dashboard -> API Keys & Integrations). Pass as a GitHub Secret.'
    required: true
  api-url:
    description: 'DRAVE SaaS API base URL. Override only if using a self-hosted instance.'
    required: false
    default: 'https://drave-bfsi.onrender.com'

outputs:
  total:
    description: 'Total number of rules processed.'
    value: ${{ steps.drave.outputs.total }}
  passed:
    description: 'Number of rules that passed all hard gates.'
    value: ${{ steps.drave.outputs.passed }}
  failed:
    description: 'Number of rules that failed hard gates.'
    value: ${{ steps.drave.outputs.failed }}
  synced:
    description: 'Number of rules successfully synced to the DRAVE API.'
    value: ${{ steps.drave.outputs.synced }}

runs:
  using: 'composite'
  steps:
    - name: Authenticate to GHCR
      shell: bash
      run: |
        echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
    - name: Pull DRAVE Engine Image
      shell: bash
      run: |
        docker pull ghcr.io/rushi19-04/drave-engine:1
        
    - name: Execute Validation
      id: drave
      shell: bash
      run: |
        docker run --rm \
          --workdir /github/workspace \
          -v "${{ github.workspace }}:/github/workspace" \
          -v "${GITHUB_OUTPUT}:${GITHUB_OUTPUT}" \
          -e GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
          -e INPUT_RULE_PATHS="${{ inputs.rule-paths }}" \
          -e INPUT_API_KEY="${{ inputs.api-key }}" \
          -e INPUT_API_URL="${{ inputs.api-url }}" \
          ghcr.io/rushi19-04/drave-engine:1
